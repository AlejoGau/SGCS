        body, .x-body {

        }
        .desktop-dataview,
        .desktopwidgets {
            position : absolute !important;
        }
        .loading-wrapper {
            width: 100vw;
            height: 100vh
        }
        #loading {
            display:table-cell;
            vertical-align:middle;
        }

            margin-top: 20px;
        }
        /* FONTS LATO */

        .x-panel-body-default {
            background : transparent !important;
        }
        .x-box-inner {
            overflow : visible !important;
        }
        .x-menu .x-panel-bodyWrap {
            background-color : white;
        }
        .x-menu .x-box-inner {
            overflow : hidden !important;
        }

        /*----------------------------------------------------------------------
        DESKTOPSTATUS
        -------------------------------------------------------------------*/
        .ux-desktop-status {
            padding-right: 30px !important;
            padding-top: 15px !important;
            line-height: 20px !important;
            font: 100 20px lato,tahoma,arial,verdana,sans-serif !important;
            background-color: rgba(51, 51, 51, 0.4) !important;
            border: 0 !important;
            padding: 11px 10px !important;
            background-image : none !important;
            border-radius: 0 !important;
        }

        .ux-desktop-status span {
            color: white !important;
            text-transform : uppercase !important;
        }

        .ux-desktop-desktopstatus .x-btn-over {
            background-color: rgba(51, 51, 51, 0.4) !important; 
        }
        .ux-desktop-desktopstatus.x-panel-default { 
            border:0 !important;
        }

        .x-btn-icon-el-default-toolbar-small.mail33x33 {     
            background-size: 16px 16px !important;
            background-repeat: no-repeat !important; 
        }
        .msgBlod * {
            font-weight:bold !important;   
        }
        .icon-mensajes {
            position: absolute !important;
            left: 0 !important;
            top: -5px !important;
        }

        /*----------------------------------------------------------------------
        DESKTOPCLOCK
        -------------------------------------------------------------------*/
        .ux-desktop-desktopclock {
            padding-right: 30px !important;
            padding-top: 15px !important;
        }

        .ux-desktopclock-dayofweek {
            font-family: 'latolight' !important;
            color: white !important;
        }

        .ux-desktopclock-dayofweek .x-form-display-field{
            line-height: 30px !important;
            font-size: 35px !important;
            font-family: 'latolight' !important;
            color: white !important;
            margin-bottom: 10px !important;
        }

        .ux-desktopclock-date .x-form-display-field{
            line-height: 30px !important;
            font-size: 50px !important;
            font-family: 'latolight' !important;
            color: white !important;
            margin-bottom:10px !important;
        }

        .ux-desktopclock-time .x-form-display-field{
            line-height: 60px !important;
            font-size: 100px !important;
            font-family: 'latolight' !important;
            color: white !important;
        }
